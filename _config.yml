title: Byteshire
description: Byteshire LLC makes Discboard — an album-listening app for iPhone, iPad, and Mac.
url: https://byteshire.com

# Discboard's App Store identity. Every store link on this site is built from
# these two values (see _layouts/redirect.html and discboard.html) so a campaign
# token is the only thing a page has to supply. `pt` is the App Analytics
# provider token from App Store Connect → Analytics → Acquisition → Campaigns.
discboard_app_id: "6768056000"
discboard_campaign_pt: "128711249"

markdown: kramdown
permalink: pretty

# Jekyll omits dot-directories by default, so force the Apple App Site
# Association (Universal Links for Discboard's share extension) into _site.
# The file has no front matter, so Jekyll copies it verbatim.
include:
  - .well-known

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .bundle
