<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title and page.url != "/" %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
{%- if page.promo_slug %}
<meta name="apple-itunes-app" content="app-id={{ site.discboard_app_id }}, app-argument={{ '/b/' | append: page.promo_slug | absolute_url }}">
<meta property="og:image" content="{{ page.url | absolute_url }}wallpaper.jpg">
{%- endif %}
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
